name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/role-authentication]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Static, unit and public browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use project npm version
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      # Hosted integration requires separately verified TEST credentials and mail-hook readiness.
      - name: Run unit and component tests
        run: npm test -- tests/unit

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build and run public browser tests (hosted flows require TEST setup)
        run: npm run test:e2e
