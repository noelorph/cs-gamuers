<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:745px;height:620px;background:#FFFFFF;" width="745px" height="620px" viewBox="0 0 745 620" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="13"><text x="232.097" y="23.535" fill="#000" font-size="14" textLength="273.807" font-weight="700">UC-06  Administrator responsibilities</text></g><!--cluster CS-GAMUERS: account administration--><g class="cluster" data-qualified-name="CS-GAMUERS. account administration" id="ent0002" data-source-line="17"><rect x="439" y="41.488" width="290" height="542" fill="none" style="stroke:#181818;stroke-width:1;" rx="4" ry="4"/><text x="448.252" y="57.023" fill="#000" font-size="14" textLength="271.496" font-weight="700">CS-GAMUERS: account administration</text></g><!--entity A--><g class="entity" data-qualified-name="A" id="ent0001" data-source-line="16"><ellipse cx="212.36" cy="290.988" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M212.36,298.988 L212.36,325.988 M199.36,306.988 L225.36,306.988 M212.36,325.988 L199.36,340.988 M212.36,325.988 L225.36,340.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="165.5" y="356.023" fill="#000" font-size="14" textLength="93.721">Administrator</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="34"><path d="M6,380.988 L6,481.918 A4,4 0 0 0 10,485.918 L414.563,485.918 A4,4 0 0 0 418.563,481.918 L418.563,386.988 L408.563,376.988 L216.5,376.988 L212.5,358.8 L208.5,376.988 L10,376.988 A4,4 0 0 0 6,380.988" style="stroke:#B6A16C;stroke-width:0.5;" fill="#FFF8DC"/><path d="M408.563,376.988 L408.563,384.988 A2,2 0 0 0 410.563,386.988 L418.563,386.988 L408.563,376.988" style="stroke:#B6A16C;stroke-width:0.5;" fill="#FFF8DC"/><text x="12" y="395.523" fill="#000" font-size="14" textLength="353.158">Reasons and notifications apply as specified in PRD.</text><text x="12" y="412.012" fill="#000" font-size="14" textLength="383.564">Transfer owned content before removing Faculty access.</text><text x="12" y="428.5" fill="#000" font-size="14" textLength="289.967">Cannot change own role or deactivate self.</text><text x="12" y="444.988" fill="#000" font-size="14" textLength="304.281">Cannot remove the last active Administrator.</text><text x="12" y="461.477" fill="#000" font-size="14" textLength="391.563">Role changes: Faculty, Program Head, Administrator only.</text><text x="12" y="477.965" fill="#000" font-size="14" textLength="357.472">No learning-score edits, private chat, or publication.</text></g><!--entity U0--><g class="entity" data-qualified-name="CS-GAMUERS. account administration.U0" id="ent0003" data-source-line="18"><ellipse cx="583.878" cy="110.395" rx="101.878" ry="25.907" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="512.706" y="107.482" fill="#000" font-size="14" textLength="142.345">Approve student and</text><text x="517.966" y="123.97" fill="#000" font-size="14" textLength="131.824">faculty applications</text></g><!--entity U1--><g class="entity" data-qualified-name="CS-GAMUERS. account administration.U1" id="ent0004" data-source-line="19"><ellipse cx="584.094" cy="180.446" rx="102.094" ry="25.958" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="512.925" y="177.459" fill="#000" font-size="14" textLength="142.338">Invite Administrators</text><text x="517.502" y="193.948" fill="#000" font-size="14" textLength="133.185">and Program Heads</text></g><!--entity U2--><g class="entity" data-qualified-name="CS-GAMUERS. account administration.U2" id="ent0005" data-source-line="20"><ellipse cx="584.235" cy="250.535" rx="115.735" ry="25.547" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="479.306" y="255.279" fill="#000" font-size="14" textLength="209.856">Correct verified identity details</text></g><!--entity U3--><g class="entity" data-qualified-name="CS-GAMUERS. account administration.U3" id="ent0006" data-source-line="21"><ellipse cx="583.851" cy="320.459" rx="120.351" ry="26.47" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="492.007" y="318.837" fill="#000" font-size="14" textLength="183.688">Assist recovery and reopen</text><text x="510.792" y="335.326" fill="#000" font-size="14" textLength="146.118">a rejected application</text></g><!--entity U4--><g class="entity" data-qualified-name="CS-GAMUERS. account administration.U4" id="ent0007" data-source-line="22"><ellipse cx="584.224" cy="393.333" rx="127.224" ry="27.845" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="467.038" y="398.077" fill="#000" font-size="14" textLength="234.37">Change another staff member role</text></g><!--entity U5--><g class="entity" data-qualified-name="CS-GAMUERS. account administration.U5" id="ent0008" data-source-line="23"><ellipse cx="583.963" cy="466.381" rx="122.463" ry="26.893" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="471.837" y="471.125" fill="#000" font-size="14" textLength="224.253">Deactivate or reactivate accounts</text></g><!--entity U6--><g class="entity" data-qualified-name="CS-GAMUERS. account administration.U6" id="ent0009" data-source-line="24"><ellipse cx="583.853" cy="539.659" rx="128.853" ry="28.171" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="464.942" y="544.403" fill="#000" font-size="14" textLength="237.822">Read administrative activity history</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk10" data-link-type="association"><path d="M251.961,282.237 C294.275,242.297 366.015,180.672 439,145.488 C452.442,139.008 467.184,133.668 481.948,129.284" style="stroke:#334155;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk11" data-link-type="associ