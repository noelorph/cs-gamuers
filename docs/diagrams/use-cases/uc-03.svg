<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:721px;height:543px;background:#FFFFFF;" width="721px" height="543px" viewBox="0 0 721 543" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="13"><text x="265.956" y="23.535" fill="#000" font-size="14" textLength="182.089" font-weight="700">UC-03  Student guidance</text></g><!--cluster CS-GAMUERS: personal guidance--><g class="cluster" data-qualified-name="CS-GAMUERS. personal guidance" id="ent0002" data-source-line="17"><rect x="428" y="41.488" width="277" height="465" fill="none" style="stroke:#181818;stroke-width:1;" rx="4" ry="4"/><text x="447.777" y="57.023" fill="#000" font-size="14" textLength="237.446" font-weight="700">CS-GAMUERS: personal guidance</text></g><!--entity A--><g class="entity" data-qualified-name="A" id="ent0001" data-source-line="16"><ellipse cx="207" cy="255.988" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M207,263.988 L207,290.988 M194,271.988 L220,271.988 M207,290.988 L194,305.988 M207,290.988 L220,305.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="181" y="321.023" fill="#000" font-size="14" textLength="52.001">Student</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="32"><path d="M6,345.488 L6,429.93 A4,4 0 0 0 10,433.93 L403.816,433.93 A4,4 0 0 0 407.816,429.93 L407.816,351.488 L397.816,341.488 L211,341.488 L207,323.838 L203,341.488 L10,341.488 A4,4 0 0 0 6,345.488" style="stroke:#B6A16C;stroke-width:0.5;" fill="#FFF8DC"/><path d="M397.816,341.488 L397.816,349.488 A2,2 0 0 0 399.816,351.488 L407.816,351.488 L397.816,341.488" style="stroke:#B6A16C;stroke-width:0.5;" fill="#FFF8DC"/><text x="12" y="360.023" fill="#000" font-size="14" textLength="296.181">Personalization requires a complete profile.</text><text x="12" y="376.512" fill="#000" font-size="14" textLength="260.853">At most one accepted active roadmap.</text><text x="12" y="393" fill="#000" font-size="14" textLength="232.634">20 successful AI requests per day.</text><text x="12" y="409.488" fill="#000" font-size="14" textLength="329.779">AI cannot start learning or accept a plan silently.</text><text x="12" y="425.977" fill="#000" font-size="14" textLength="380.816">Private history expires after 90 days without a message.</text></g><!--entity U0--><g class="entity" data-qualified-name="CS-GAMUERS. personal guidance.U0" id="ent0003" data-source-line="18"><ellipse cx="566.593" cy="110.407" rx="115.093" ry="25.419" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="499.823" y="105.388" fill="#000" font-size="14" textLength="133.54">Request course and</text><text x="483.15" y="121.876" fill="#000" font-size="14" textLength="166.886">career-path suggestions</text></g><!--entity U1--><g class="entity" data-qualified-name="CS-GAMUERS. personal guidance.U1" id="ent0004" data-source-line="19"><ellipse cx="566.288" cy="180.537" rx="97.788" ry="26.048" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="501.709" y="176.653" fill="#000" font-size="14" textLength="129.158">Preview and accept</text><text x="498.479" y="193.142" fill="#000" font-size="14" textLength="135.618">a personal roadmap</text></g><!--entity U2--><g class="entity" data-qualified-name="CS-GAMUERS. personal guidance.U2" id="ent0005" data-source-line="20"><ellipse cx="566.303" cy="250.382" rx="112.303" ry="25.393" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="500.134" y="245.546" fill="#000" font-size="14" textLength="132.337">Request and accept</text><text x="485.823" y="262.034" fill="#000" font-size="14" textLength="160.959">a replacement roadmap</text></g><!--entity U3--><g class="entity" data-qualified-name="CS-GAMUERS. personal guidance.U3" id="ent0006" data-source-line="21"><ellipse cx="566.262" cy="321.341" rx="122.262" ry="26.852" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="485.862" y="316.712" fill="#000" font-size="14" textLength="160.802">View roadmap progress</text><text x="475.016" y="333.2" fill="#000" font-size="14" textLength="182.492">and optional time estimate</text></g><!--entity U4--><g class="entity" data-qualified-name="CS-GAMUERS. personal guidance.U4" id="ent0007" data-source-line="22"><ellipse cx="566.576" cy="393.703" rx="121.576" ry="26.715" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="479.793" y="390.531" fill="#000" font-size="14" textLength="173.564">Ask AI learning questions</text><text x="482.965" y="407.019" fill="#000" font-size="14" textLength="167.221">and request suggestions</text></g><!--entity U5--><g class="entity" data-qualified-name="CS-GAMUERS. personal guidance.U5" id="ent0008" data-source-line="23"><ellipse cx="566.429" cy="464.393" rx="106.429" ry="25.905" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="491.975" y="461.483" fill="#000" font-size="14" textLength="148.907">Read or delete private</text><text x="497.502" y="477.971" fill="#000" font-size="14" textLength="137.854">conversation history</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-link-type="association"><path d="M233.237,265.6 C272.644,235.462 352.16,178.27 428,145.488 C435.914,142.068 444.234,138.928 452.701,136.057" style="stroke:#334155;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk10" data-link-type="association"><path d="M233.288,277.124 C274.082,263.728 357.023,236.898 428,216.488 C441.043,212.738 454.829,208.937 468.436,205.281" style="stroke:#334155;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk11" data-link-type="association"><path d="M233.139,283.027 C278.356,278.6 375.942,269.046 453.738,261.4