4" textLength="363.351">Administrator approval is required for Faculty access.</text><text x="12" y="413.512" fill="#000" font-size="14" textLength="370.187">Program Head approval is required to publish content.</text><text x="12" y="430" fill="#000" font-size="14" textLength="375.703">Career-path ownership grants no extra student access.</text><text x="12" y="446.488" fill="#000" font-size="14" textLength="304.562">Faculty cannot read private AI conversations.</text></g><!--entity U0--><g class="entity" data-qualified-name="CS-GAMUERS. faculty work.U0" id="ent0003" data-source-line="18"><ellipse cx="571.767" cy="107.442" rx="102.767" ry="22.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="480.914" y="112.186" fill="#000" font-size="14" textLength="181.706">Verify student applications</text></g><!--entity U1--><g class="entity" data-qualified-name="CS-GAMUERS. faculty work.U1" id="ent0004" data-source-line="19"><ellipse cx="571.872" cy="174.463" rx="117.872" ry="25.974" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="464.651" y="179.207" fill="#000" font-size="14" textLength="214.443">Write and revise owned courses</text></g><!--entity U2--><g class="entity" data-qualified-name="CS-GAMUERS. faculty work.U2" id="ent0005" data-source-line="20"><ellipse cx="571.807" cy="247.45" rx="132.807" ry="28.961" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="448.719" y="252.194" fill="#000" font-size="14" textLength="246.176">Write and revise owned career paths</text></g><!--entity U3--><g class="entity" data-qualified-name="CS-GAMUERS. faculty work.U3" id="ent0006" data-source-line="21"><ellipse cx="572.019" cy="322.592" rx="128.519" ry="28.104" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="476.09" y="319.391" fill="#000" font-size="14" textLength="191.857">Maintain shared assessment</text><text x="478.691" y="335.879" fill="#000" font-size="14" textLength="186.655">when assigned as its owner</text><