<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:730px;height:556px;background:#FFFFFF;" width="730px" height="556px" viewBox="0 0 730 556" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="13"><text x="245.265" y="23.535" fill="#000" font-size="14" textLength="232.47" font-weight="700">UC-05  Program Head oversight</text></g><!--cluster CS-GAMUERS: academic oversight--><g class="cluster" data-qualified-name="CS-GAMUERS. academic oversight" id="ent0002" data-source-line="17"><rect x="418" y="41.488" width="296" height="478" fill="none" style="stroke:#181818;stroke-width:1;" rx="4" ry="4"/><text x="443.606" y="57.023" fill="#000" font-size="14" textLength="244.788" font-weight="700">CS-GAMUERS: academic oversight</text></g><!--entity A--><g class="entity" data-qualified-name="A" id="ent0001" data-source-line="16"><ellipse cx="202.193" cy="260.988" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M202.193,268.988 L202.193,295.988 M189.193,276.988 L215.193,276.988 M202.193,295.988 L189.193,310.988 M202.193,295.988 L215.193,310.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="154" y="326.023" fill="#000" font-size="14" textLength="96.387">Program Head</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="32"><path d="M6,350.488 L6,418.441 A4,4 0 0 0 10,422.441 L393.727,422.441 A4,4 0 0 0 397.727,418.441 L397.727,356.488 L387.727,346.488 L206,346.488 L202,328.859 L198,346.488 L10,346.488 A4,4 0 0 0 6,350.488" style="stroke:#B6A16C;stroke-width:0.5;" fill="#FFF8DC"/><path d="M387.727,346.488 L387.727,354.488 A2,2 0 0 0 389.727,356.488 L397.727,356.488 L387.727,346.488" style="stroke:#B6A16C;stroke-width:0.5;" fill="#FFF8DC"/><text x="12" y="365.023" fill="#000" font-size="14" textLength="249.266">Oversight only: no course authoring.</text><text x="12" y="381.512" fill="#000" font-size="14" textLength="370.727">Reports may be filtered by course, revision, and dates.</text><text x="12" y="398" fill="#000" font-size="14" textLength="352.994">Small-group protection applies below five students.</text><text x="12" y="414.488" fill="#000" font-size="14" textLength="317.399">No individual records or private conversations.</text></g><!--entity U0--><g class="entity" data-qualified-name="CS-GAMUERS. academic oversight.U0" id="ent0003" data-source-line="18"><ellipse cx="566.214" cy="113.431" rx="130.214" ry="28.443" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="471.263" y="109.487" fill="#000" font-size="14" textLength="189.902">Review course, career-path,</text><text x="467.482" y="125.975" fill="#000" font-size="14" textLength="197.463">and assessment submissions</text></g><!--entity U1--><g class="entity" data-qualified-name="CS-GAMUERS. academic oversight.U1" id="ent0004" data-source-line="19"><ellipse cx="565.907" cy="186.37" rx="117.407" ry="25.881" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="459.184" y="191.114" fill="#000" font-size="14" textLength="213.445">Approve publication or revision</text></g><!--entity U2--><g class="entity" data-qualified-name="CS-GAMUERS. academic oversight.U2" id="ent0005" data-source-line="20"><ellipse cx="566.017" cy="255.392" rx="112.517" ry="24.903" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="478.077" y="255.326" fill="#000" font-size="14" textLength="175.882">Request changes or reject</text><text x="520.5" y="271.814" fill="#000" font-size="14" textLength="91.034">with a reason</text></g><!--entity U3--><g class="entity" data-qualified-name="CS-GAMUERS. academic oversight.U3" id="ent0006" data-source-line="21"><ellipse cx="565.775" cy="325.443" rx="120.275" ry="26.455" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="455.983" y="330.187" fill="#000" font-size="14" textLength="219.584">Approve course/path retirement</text></g><!--entity U4--><g class="entity" data-qualified-name="CS-GAMUERS. academic oversight.U4" id="ent0007" data-source-line="22"><ellipse cx="565.787" cy="398.546" rx="130.787" ry="28.557" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="472.097" y="394.154" fill="#000" font-size="14" textLength="187.38">Transfer content ownership</text><text x="464.553" y="410.642" fill="#000" font-size="14" textLength="202.467">and assign assessment owner</text></g><!--entity U5--><g class="entity" data-qualified-name="CS-GAMUERS. academic oversight.U5" id="ent0008" data-source-line="23"><ellipse cx="565.989" cy="474.286" rx="131.989" ry="28.798" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="466.4" y="470.879" fill="#000" font-size="14" textLength="199.179">View aggregate participation,</text><text x="467.172" y="487.367" fill="#000" font-size="14" textLength="197.634">completion, and quiz reports</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-link-type="association"><path d="M250.403,253.437 C292.358,222.257 356.335,178.542 418,151.488 C425.724,148.099 433.815,144.964 442.058,142.072" style="stroke:#334155;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk10" data-link-type="association"><path d="M250.081,274.227 C293.431,259.53 359.663,237.768 418,221.488 C428.866,218.456 440.228,215.455 451.615,212.56" style="stroke:#334155;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk11" data-link-type="association"><path d="M250.325,285.913 C301.591,280.956 385.184,272.874 453.33,266.285" style="stroke:#334155;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk12" data-link-type="association"><path d="M250.325,295.064 C299.579,299.826 378.67