<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:713px;height:588px;background:#FFFFFF;" width="713px" height="588px" viewBox="0 0 713 588" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="13"><text x="207.651" y="23.535" fill="#000" font-size="14" textLength="290.698" font-weight="700">UC-01  Account access and applications</text></g><!--cluster CS-GAMUERS: account access--><g class="cluster" data-qualified-name="CS-GAMUERS. account access" id="ent0002" data-source-line="17"><rect x="411" y="41.488" width="286" height="510" fill="none" style="stroke:#181818;stroke-width:1;" rx="4" ry="4"/><text x="447.633" y="57.023" fill="#000" font-size="14" textLength="212.734" font-weight="700">CS-GAMUERS: account access</text></g><!--entity A--><g class="entity" data-qualified-name="A" id="ent0001" data-source-line="16"><ellipse cx="198.391" cy="271.988" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M198.391,279.988 L198.391,306.988 M185.391,287.988 L211.391,287.988 M198.391,306.988 L185.391,321.988 M198.391,306.988 L211.391,321.988" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="104" y="337.023" fill="#000" font-size="14" textLength="188.781">Applicant or account holder</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="34"><path d="M6,361.988 L6,462.918 A4,4 0 0 0 10,466.918 L387.144,466.918 A4,4 0 0 0 391.144,462.918 L391.144,367.988 L381.144,357.988 L202.5,357.988 L198.5,339.8 L194.5,357.988 L10,357.988 A4,4 0 0 0 6,361.988" style="stroke:#B6A16C;stroke-width:0.5;" fill="#FFF8DC"/><path d="M381.144,357.988 L381.144,365.988 A2,2 0 0 0 383.144,367.988 L391.144,367.988 L381.144,357.988" style="stroke:#B6A16C;stroke-width:0.5;" fill="#FFF8DC"/><text x="12" y="376.523" fill="#000" font-size="14" textLength="269.124">Registration: Students and Faculty only.</text><text x="12" y="393.012" fill="#000" font-size="14" textLength="322.451">Invitations: Administrators and Program Heads.</text><text x="12" y="409.5" fill="#000" font-size="14" textLength="329.677">Pending applicants have application access only.</text><text x="12" y="425.988" fill="#000" font-size="14" textLength="220.486">Self-deactivation: Students only.</text><text x="12" y="442.477" fill="#000" font-size="14" textLength="233.748">Each account has exactly one role.</text><text x="12" y="458.965" fill="#000" font-size="14" textLength="364.144">Other roles use Administrator-managed deactivation.</text></g><!--entity U0--><g class="entity" data-qualified-name="CS-GAMUERS. account access.U0" id="ent0003" data-source-line="18"><ellipse cx="553.992" cy="106.687" rx="96.492" ry="21.698" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="470.078" y="111.431" fill="#000" font-size="14" textLength="167.829">Register and verify email</text></g><!--entity U1--><g class="entity" data-qualified-name="CS-GAMUERS. account access.U1" id="ent0004" data-source-line="19"><ellipse cx="554.074" cy="172.503" rx="120.574" ry="26.515" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="475.707" y="167.962" fill="#000" font-size="14" textLength="156.734">View application status</text><text x="465.426" y="184.45" fill="#000" font-size="14" textLength="177.297">and correct an application</text></g><!--entity U2--><g class="entity" data-qualified-name="CS-GAMUERS. account access.U2" id="ent0005" data-source-line="20"><ellipse cx="553.961" cy="236.28" rx="81.961" ry="18.792" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="486.613" y="241.025" fill="#000" font-size="14" textLength="134.695">Accept an invitation</text></g><!--entity U3--><g class="entity" data-qualified-name="CS-GAMUERS. account access.U3" id="ent0006" data-source-line="21"><ellipse cx="554.03" cy="301.294" rx="127.03" ry="27.806" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="437.05" y="306.038" fill="#000" font-size="14" textLength="233.96">Sign in with approved permissions</text></g><!--entity U4--><g class="entity" data-qualified-name="CS-GAMUERS. account access.U4" id="ent0007" data-source-line="22"><ellipse cx="553.888" cy="371.366" rx="104.888" ry="23.378" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="460.711" y="376.11" fill="#000" font-size="14" textLength="186.354">Reset a forgotten password</text></g><!--entity U5--><g class="entity" data-qualified-name="CS-GAMUERS. account access.U5" id="ent0008" data-source-line="23"><ellipse cx="553.942" cy="439.677" rx="118.942" ry="26.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="445.575" y="444.421" fill="#000" font-size="14" textLength="216.733">Request assisted email recovery</text></g><!--entity U6--><g class="entity" data-qualified-name="CS-GAMUERS. account access.U6" id="ent0009" data-source-line="24"><ellipse cx="553.942" cy="509.677" rx="118.942" ry="26.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="445.575" y="514.421" fill="#000" font-size="14" textLength="216.733">Deactivate own student account</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk10" data-link-type="association"><path d="M237.174,263.25 C276.889,225.219 343.015,168.11 411,136.488 C425.508,129.74 441.555,124.494 457.485,120.42" style="stroke:#334155;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk11" data-link-type="association"><path d="M277.604,263.431 C316.988,245.201 365.862,224.014 411,208.488 C420.62,205.179 430.7,202.026 440.863,199.059" style="stroke:#334155;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk12" data-link-type="association"><path d="M293.303,284.24 C348.939,274.01 418.75