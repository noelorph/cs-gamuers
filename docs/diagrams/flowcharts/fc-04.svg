;stroke-width:0.5;" rx="4" ry="4"/><text x="247.899" y="754.441" fill="#000" font-size="14" textLength="323.442">Save submitted attempt and keep highest score</text><polygon points="235.496,787.395,583.746,787.395,595.746,799.395,583.746,811.395,235.496,811.395,223.496,799.395,235.496,787.395" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="235.496" y="804.686" fill="#000" font-size="14" textLength="348.25">Exact highest percentage meets passing threshold?</text><text x="201.245" y="796.441" fill="#000" font-size="14" textLength="22.251">yes</text><text x="595.746" y="796.441" fill="#000" font-size="14" textLength="17.288">no</text><rect x="131.681" y="821.395" width="163.63" height="36.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="141.681" y="844.93" fill="#000" font-size="14" textLength="143.63">Quiz status is Passed</text><rect x="487.188" y="821.395" width="237.116" height="36.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="497.188" y="844.93" fill="#000" font-size="14" textLength="217.116">Quiz status remains In progress</text><polygon points="409.621,863.883,421.621,875.883,409.621,887.883,397.621,875.883,409.621,863.883" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="240.702" y="907.883" width="337.837" height="36.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="250.702" y="931.418" fill="#000" font-size="14" textLength="317.837">Show score, correct answers, and explanations</text><rect x="216.141" y="964.371" width="386.96" height="36.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="226.141" y="987.906" fill="#000" font-size="14" textLength="366.96">Calculate progress from passed required quizzes only</text><path d="M518.783,1010.859 L518.783,1119.789 L926.971,1119.789 L926.971,1020.859 L916.