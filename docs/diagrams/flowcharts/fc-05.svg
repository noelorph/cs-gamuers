yet".</text><text x="606.884" y="224.488" fill="#000" font-size="14" textLength="256.225">Correct = 1 point; other answers = 0.</text><text x="606.884" y="240.977" fill="#000" font-size="14" textLength="312.163">Untimed and optional, with unlimited retakes.</text><rect x="245.152" y="200.953" width="335.731" height="36.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="255.152" y="224.488" fill="#000" font-size="14" textLength="315.731">Answer 15 questions: 3 per foundational topic</text><rect x="283.519" y="268.93" width="258.998" height="36.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="293.519" y="292.465" fill="#000" font-size="14" textLength="238.998">Save answers and show save status</text><polygon points="259.121,325.418,566.916,325.418,578.916,337.418,566.916,349.418,259.121,349.418,247.121,337.418,259.121,325.418" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="259.121" y="342.709" fill="#000" font-size="14" textLength="307.795">All questions answered and Student submits?</text><text x="224.87" y="334.465" fill="#000" font-size="14" textLength="22.251">yes</text><text x="578.916" y="334.465" fill="#000" font-size="14" textLength="17.288">no</text><rect x="114.913" y="359.418" width="185.443" height="36.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="124.913" y="382.953" fill="#000" font-size="14" textLength="165.443">Record submission once</text><rect x="16" y="415.906" width="383.269" height="36.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="26" y="439.441" fill="#000" font-size="14" textLength="363.269">Show topic scores, correct answers, and explanations</text><rect x="80.668" y="472.395" width="253.933" height="52.977" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="90.668" y="495.93" fill="#000" font-size="14" textLe